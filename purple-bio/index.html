  <div class="gradient-bg"></div>

  <main class="container">
    <section class="card">
      <div class="avatar-wrap">
        <img id="avatar" alt="Avatar" />
      </div>
      <h1 id="displayName">Numele Tău</h1>
      <div id="username" class="username">@username</div>
      <p id="bio" class="bio">Bio scurt aici.</p>

      <div id="badges" class="badges"></div>

      <div class="actions">
        <button id="shareBtn" class="btn btn-solid">
          <svg class="btn-icon" width="18" height="18"><use href="#icon-share"/></svg>
          <span>Share</span>
        </button>
        <button id="copyBtn" class="btn btn-ghost">
          <svg class="btn-icon" width="18" height="18"><use href="#icon-copy"/></svg>
          <span>Copiază link</span>
        </button>
      </div>

      <div id="links" class="links"></div>
    </section>

    <footer class="footer">
      <span>Făcut cu drag în mov</span>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
